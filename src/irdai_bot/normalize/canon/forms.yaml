# IRDAI public-disclosure forms for life insurers, by form number.
#
# Two disclosure frameworks apply (extract/disclosures.py:schema_version):
#   v2010 — "Public Disclosures by Insurers" circular (Jan 2010, amended 2011/2012):
#           older bundles split into "financial" (L-1..L-22) and "other" (L-24..L-42) files.
#   v2021 — revised instructions superseding it, effective FY2021-22 (quarterly uploads
#           from the period ending Sep 30, 2021): one L-1..L-45 bundle.
#
# Form NUMBERS carry the same meaning in both: verified 2026-09-15 against the page
# headings of every annual bundle in data/raw (HDFC Life + Axis Max Life, FY2012-13 and
# FY2019-20..FY2025-26). Only suffixes/wording differ ("L-1" vs "L-1-A-RA" — and the
# suffixed ids already appear in FY2019-20 v2010 filings, so they don't identify the
# version), and line items within a form change between versions. L-43..L-45 have no
# v2010 equivalent. L-23 is absent from some v2010 bundles.
forms:
