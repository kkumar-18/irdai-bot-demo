[project]
name = "irdai-bot"
version = "0.1.0"
description = "Scrape, normalize, and compare IRDAI public disclosure forms across insurers"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-core>=0.3",
    "pydantic>=2.9",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "sqlglot>=25.0",
    "click>=8.1",
    "pyyaml>=6.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "psycopg[binary]>=3.2",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-ollama>=1.1.0",
    "langfuse>=3.0",
]

[project.scripts]
irdai-bot = "irdai_bot.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/irdai_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
